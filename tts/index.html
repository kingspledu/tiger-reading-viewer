<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WYTT TTS Code Copy</title><style>body{font-family:system-ui;max-width:900px;margin:auto;padding:24px}button{margin:4px;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}textarea{width:100%;height:420px;margin-top:15px;font-family:monospace;font-size:12px}</style><h1>When You Trap a Tiger TTS</h1><p>장 하나만 불러와 복사합니다. 전체 29장 HTML을 한꺼번에 메모리에 넣지 않습니다.</p><div id="buttons"></div><p id="status">장을 선택하세요.</p><textarea id="code" readonly></textarea><script>const b=document.getElementById("buttons"),c=document.getElementById("code"),s=document.getElementById("status");for(let i=1;i<=29;i++){const x=document.createElement("button");x.textContent=i+"장 코드 복사";x.onclick=()=>copy(i);b.appendChild(x)}async function copy(i){s.textContent=i+"장 불러오는 중...";const r=await fetch("chapters/WYTT_C"+String(i).padStart(2,"0")+"_V05_GEMINI_CANVAS_TTS.html");const t=await r.text();c.value=t;try{await navigator.clipboard.writeText(t);s.textContent=i+"장 코드 복사 완료 ("+t.length.toLocaleString()+"자)"}catch(e){c.focus();c.select();s.textContent=i+"장 코드를 선택했습니다. Ctrl+C를 누르세요."}}</script></html>
